name: Notify new leads
on:
  push:
    branches: [main]
    paths: ['avel-k7q2/index.html']
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send phone notification
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          lines = os.environ.get("MSG", "").splitlines()
          first = lines[0] if lines else ""
          body = next((l for l in lines[1:] if l.strip() and not l.startswith(("Co-Authored", "Claude-Session"))), "") or "הרשימה באתר עודכנה"
          data = {"topic": "kave-leads-17285342", "title": "לידים חדשים – מצבות קוה", "message": body, "tags": ["bell"],
                  "click": "https://yairakiva55-ship-it.github.io/avel-k7q2/", "priority": 4}
          req = urllib.request.Request("https://ntfy.sh/", data=json.dumps(data).encode(), headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req).read().decode())
          PY
