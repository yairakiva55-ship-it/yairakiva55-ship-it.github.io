name: Notify new leads
on:
  push:
    branches: [main]
    paths: ['avel-k7q2/index.html']
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send phone notification
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST="$(printf '%s' "$MSG" | head -n1)"
          case "$FIRST" in
            *"Update obituary list"*|*"new lead"*|*"test lead"*|*"notification"*) ;;
            *) echo "skip: $FIRST"; exit 0;;
          esac
          BODY="$(printf '%s' "$MSG" | sed -n '3,4p' | grep -v '^Co-Authored' | head -n1)"
          [ -z "$BODY" ] && BODY="הרשימה באתר עודכנה"
          curl -s -H "Title: לידים חדשים – מצבות קוה" -H "Tags: bell" -H "Click: https://yairakiva55-ship-it.github.io/avel-k7q2/" -d "$BODY" "https://ntfy.sh/kave-leads-17285342"
